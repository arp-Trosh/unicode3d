# Runs the tests on Linux, Windows and macOS, on the oldest and newest supported Python, on every push.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install (as a game would)
        run: python -m pip install --disable-pip-version-check .

      - name: Unit tests
        run: python -m unittest -v
